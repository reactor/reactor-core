plugins {
	id 'java-gradle-plugin'
}

repositories {
	// On CI use only USW1 (proxies Maven Central) to avoid 429 from Maven Central
	if (System.getenv("GITHUB_ACTION") != null && System.getenv("GITHUB_ACTOR") != "dependabot[bot]") {
		maven {
			name = "usw1-spring-maven-virtual"
			url = "https://usw1.packages.broadcom.com/artifactory/spring-maven-virtual"
			credentials {
				username = System.getenv("COMMERCIAL_REPO_USERNAME")
				password = System.getenv("COMMERCIAL_REPO_PASSWORD")
			}
		}
	}
	else {
		mavenCentral()
		gradlePluginPortal()
	}
}

dependencies {
	testImplementation libs.assertJ
	testImplementation platform(libs.junit.bom)
	testImplementation libs.junit.jupiterApi
	testRuntimeOnly libs.junit.jupiterEngine
}

test {
	useJUnitPlatform()
	testLogging {
		showStackTraces = true
		exceptionFormat = "FULL"
	}
}

gradlePlugin {
	plugins {
		detectCIPlugin {
			id = "io.reactor.gradle.detect-ci"
			implementationClass = "io.reactor.gradle.DetectCiPlugin"
		}
		javaConventionsPlugin {
			id = "io.reactor.gradle.java-conventions"
			implementationClass = "io.reactor.gradle.JavaConventions"
		}
	}
}
