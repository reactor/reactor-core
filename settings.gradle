pluginManagement {
	repositories {
		// On CI use only USW1 (proxies the Gradle Plugin Portal) to avoid 429 from Maven Central
		if (System.getenv("GITHUB_ACTION") != null && System.getenv("GITHUB_ACTOR") != "dependabot[bot]") {
			maven {
				name = "usw1-spring-plugins-gradle-virtual"
				url = "https://usw1.packages.broadcom.com/artifactory/spring-plugins-gradle-virtual"
				credentials {
					username = System.getenv("COMMERCIAL_REPO_USERNAME")
					password = System.getenv("COMMERCIAL_REPO_PASSWORD")
				}
			}
		}
		else {
			gradlePluginPortal()
		}
	}
}

plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = 'reactor'

include 'benchmarks', 'reactor-core', 'reactor-test', 'reactor-tools', 'reactor-core-micrometer'

if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
	include 'docs'
}

dependencyResolutionManagement {
  versionCatalogs {
	libs {
	  if (System.getProperty("useSnapshotMicrometerVersion")) {
		version('micrometer', '1.16.9-INTERNAL-SNAPSHOT')
		version('micrometerDocsGenerator', "1.0.5-SNAPSHOT")
		version('micrometerTracingTest', "1.6.9-INTERNAL-SNAPSHOT")
		version('contextPropagation', "1.2.1-SNAPSHOT")
	  }
	}
  }
}
