name: JCStress

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 0"
permissions: {}
jobs:
  jcstress:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: [ 3.8.x, main ]
    name: jcstress on ${{ matrix.branch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v5
        with:
          ref: ${{ matrix.branch }}
      - name: Setup Java 8
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
        with:
          distribution: 'temurin'
          java-version: 8
      - name: Setup Java 11
        if: contains('main 3.8.x', matrix.branch)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
        with:
          distribution: 'temurin'
          java-version: 11
      - name: Setup Java 25
        if: contains('main 3.8.x', matrix.branch)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Java 21
        if: contains('main 3.8.x', matrix.branch)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic
      - name: Run jcstress
        run: ./gradlew :reactor-core:jcstress --no-daemon
