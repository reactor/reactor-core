name: Snapshots Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
permissions: {}
jobs:
  run-tests:
    runs-on: ubuntu-24.04
    name: Micrometer snapshot tests on ${{ github.ref_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v5
      - name: Setup Java 8
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
        with:
          distribution: 'temurin'
          java-version: 8
      - name: Setup Java 11
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
        with:
          distribution: 'temurin'
          java-version: 11
      - name: Setup Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic
      - name: Run Gradle Tests
        run: ./gradlew :reactor-core:withMicrometerTest :reactor-core-micrometer:test -DuseSnapshotMicrometerVersion=true --no-daemon

  dispatch-maintenance-branches:
    # Schedules only fire on the default branch. A maintenance branch is tested by a run dispatched
    # on that branch, so that its code never executes in the default branch's context. Runs on
    # maintenance branches don't dispatch further.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch on 3.8.x
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run snapshots.yml --ref 3.8.x
