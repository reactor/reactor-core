name: publish
on:
  push:
    branches:
      # For branches, better to list them explicitly than regexp include.
      # Older branches are triggered using workflows present there
      - main-internal
permissions: read-all

jobs:
  # General job notes: we DON'T want to cancel any previous runs, especially in the case of a "back to snapshots" build right after a release push
  # We specify the ubuntu version to minimize the chances we have to deal with a migration during a release
  prepare:
    # Notes on prepare: this job has no access to secrets, only github token. As a result, all non-core actions are centralized here
    # This includes the tagging and drafting of release notes. Still, when possible we favor plain run of gradle tasks
    runs-on: ubuntu22-2-8
    strategy:
      fail-fast: false
      matrix:
        test-type:
          - type: core
            arguments: ":reactor-core:test --no-daemon"
          - type: core-java21
            arguments: ":reactor-core:java21Test --no-daemon"
          - type: other
            arguments: "check -x :reactor-core:test -x :reactor-core:java11Test -x :reactor-core:java21Test -x spotlessCheck -x :reactor-core:jcstress --no-daemon"
    name: prepare - ${{ matrix.test-type.type }} tests
    outputs:
      versionType: ${{ steps.version.outputs.versionType }}
      fullVersion: ${{ steps.version.outputs.fullVersion }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v5
    - name: Set up Ruby for asciidoctor-pdf
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # tag=v1
      with:
        ruby-version: 3.3.0
    - name: Install asciidoctor-pdf / rouge
      run: gem install asciidoctor-pdf rouge
    - name: Setup JDK 8
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # tag=v5
      with:
        distribution: 'temurin'
        java-version: 8
    - name: Setup JDK 11
      if: contains('main 3.7.x', github.base_ref)
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # tag=v5
      with:
        distribution: 'temurin'
        java-version: 11
    - name: Setup Java 25
      if: contains('main', github.base_ref)
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # tag=v5
      with:
        distribution: 'temurin'
        java-version: 25
    - name: Setup JDK 21
      if: contains('main 3.7.x', github.base_ref)
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # tag=v5
      with:
        distribution: 'temurin'
        java-version: 21
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      with:
        cache-provider: basic
    - name: interpret version
      env:
        COMMERCIAL_REPO_USERNAME: ${{secrets.COMMERCIAL_ARTIFACTORY_USERNAME}}
        COMMERCIAL_REPO_PASSWORD: ${{secrets.COMMERCIAL_ARTIFACTORY_PASSWORD}}
        COMMERCIAL_RELEASE_REPO_URL: ${{vars.COMMERCIAL_RELEASE_REPO_URL}}
        COMMERCIAL_SNAPSHOT_REPO_URL: ${{vars.COMMERCIAL_SNAPSHOT_REPO_URL}}
      id: version
      #we only run the qualifyVersionGha task so that no other console printing can hijack this step's output
      #output: versionType, fullVersion
      #fails if versionType is BAD, which interrupts the workflow
      run: ./gradlew qualifyVersionGha
    - name: run checks
      env:
        COMMERCIAL_REPO_USERNAME: ${{secrets.COMMERCIAL_ARTIFACTORY_USERNAME}}
        COMMERCIAL_REPO_PASSWORD: ${{secrets.COMMERCIAL_ARTIFACTORY_PASSWORD}}
        COMMERCIAL_RELEASE_REPO_URL: ${{vars.COMMERCIAL_RELEASE_REPO_URL}}
        COMMERCIAL_SNAPSHOT_REPO_URL: ${{vars.COMMERCIAL_SNAPSHOT_REPO_URL}}
      id: checks
      run: ./gradlew ${{ matrix.test-type.arguments }}

  #deploy the snapshot artifacts to Artifactory
  deploySnapshot:
    name: deploySnapshot
    runs-on: ubuntu22-2-8
    needs: [prepare]
    if: needs.prepare.outputs.versionType == 'SNAPSHOT'
    environment: snapshots
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v5
    - name: Set up Ruby for asciidoctor-pdf
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # tag=v1
      with:
        ruby-version: 3.3.0
    - name: Install asciidoctor-pdf / rouge
      run: gem install asciidoctor-pdf rouge
    - name: Setup JDK 8
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # tag=v5
      with:
        distribution: 'temurin'
        java-version: 8
    - name: Setup JDK 11
      if: contains('main 3.7.x', github.base_ref)
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # tag=v5
      with:
        distribution: 'temurin'
        java-version: 11
    - name: Setup Java 25
      if: contains('main', github.base_ref)
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # tag=v5
      with:
        distribution: 'temurin'
        java-version: 25
    - name: Setup JDK 21
      if: contains('main 3.7.x', github.base_ref)
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # tag=v5
      with:
        distribution: 'temurin'
        java-version: 21
    - name: deploy
      env:
        COMMERCIAL_REPO_USERNAME: ${{secrets.COMMERCIAL_ARTIFACTORY_USERNAME}}
        COMMERCIAL_REPO_PASSWORD: ${{secrets.COMMERCIAL_ARTIFACTORY_PASSWORD}}
        COMMERCIAL_RELEASE_REPO_URL: ${{vars.COMMERCIAL_RELEASE_REPO_URL}}
        COMMERCIAL_SNAPSHOT_REPO_URL: ${{vars.COMMERCIAL_SNAPSHOT_REPO_URL}}
        ORG_GRADLE_PROJECT_artifactory_publish_username: ${{secrets.COMMERCIAL_ARTIFACTORY_USERNAME}}
        ORG_GRADLE_PROJECT_artifactory_publish_password: ${{secrets.COMMERCIAL_ARTIFACTORY_PASSWORD}}
      run: |
          ./gradlew -Dorg.gradle.parallel=false assemble artifactoryPublish -x :docs:antora -Partifactory_publish_contextUrl=https://usw1.packages.broadcom.com -Partifactory_publish_repoKey=spring-enterprise-maven-dev-local
