name: publish
on:
  push:
    branches:
      # For branches, better to list them explicitly than regexp include.
      # Older branches are triggered using workflows present there
      - main
permissions: {}

jobs:
  # General job notes: we DON'T want to cancel any previous runs, especially in the case of a "back to snapshots" build right after a release push
  # We specify the ubuntu version to minimize the chances we have to deal with a migration during a release
  prepare:
    # Notes on prepare: this job has no access to secrets, only github token and Develocity access key. As a result, all non-core actions are centralized here
    # This includes the tagging and drafting of release notes. Still, when possible we favor plain run of gradle tasks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-type:
          - type: core
            arguments: ":reactor-core:test"
          - type: core-java21
            arguments: ":reactor-core:java21Test"
          - type: integration
            arguments: "integrationTests"
          - type: static
            arguments: "japicmp checkstyleNohttp"
    name: prepare - ${{ matrix.test-type.type }} checks
    outputs:
      versionType: ${{ steps.version.outputs.versionType }}
      fullVersion: ${{ steps.version.outputs.fullVersion }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v5
    - name: Set up Ruby for asciidoctor-pdf
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # tag=v1
      with:
        ruby-version: 3.3.0
    - name: Install asciidoctor-pdf / rouge
      run: gem install asciidoctor-pdf rouge
    - name: Setup JDK 8
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
      with:
        distribution: 'temurin'
        java-version: 8
    - name: Setup JDK 11
      if: contains('main 3.8.x', github.base_ref)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
      with:
        distribution: 'temurin'
        java-version: 11
    - name: Setup Java 25
      if: contains('main 3.8.x', github.base_ref)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
      with:
        distribution: 'temurin'
        java-version: 25
    - name: Setup JDK 21
      if: contains('main 3.8.x', github.base_ref)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
      with:
        distribution: 'temurin'
        java-version: 21
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      with:
        cache-provider: basic
        # All jobs share one cache entry, which only the integration job writes: its tests
        # compile the reactor-core tests, so it downloads what the core jobs need and more.
        cache-read-only: ${{ matrix.test-type.type != 'integration' }}
    - name: configure gradle properties
      run: |
        mkdir -p ${GRADLE_USER_HOME:-$HOME/.gradle}
        echo 'systemProp.user.name=spring-builds+github' >> ${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties
    - name: interpret version
      id: version
      #we only run the qualifyVersionGha task so that no other console printing can hijack this step's output
      #output: versionType, fullVersion
      #fails if versionType is BAD, which interrupts the workflow
      run: ./gradlew qualifyVersionGha --no-build-cache
    - name: run checks
      id: checks
      env:
        DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        # milestones and releases are built from scratch, without reusing cached task outputs
        BUILD_CACHE_FLAG: ${{ steps.version.outputs.versionType == 'SNAPSHOT' && '--build-cache' || '--no-build-cache' }}
      run: ./gradlew ${{ matrix.test-type.arguments }} "$BUILD_CACHE_FLAG"

  #deploy the snapshot artifacts to Artifactory
  deploySnapshot:
    name: deploySnapshot
    runs-on: ubuntu-24.04
    needs: [prepare]
    if: needs.prepare.outputs.versionType == 'SNAPSHOT'
    environment: snapshots
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v5
    - name: Setup JDK 8
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
      with:
        distribution: 'temurin'
        java-version: 8
    - name: Setup JDK 11
      if: contains('main 3.8.x', github.base_ref)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
      with:
        distribution: 'temurin'
        java-version: 11
    - name: Setup Java 25
      if: contains('main 3.8.x', github.base_ref)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
      with:
        distribution: 'temurin'
        java-version: 25
    - name: Setup JDK 21
      if: contains('main 3.8.x', github.base_ref)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # tag=v6.3.0
      with:
        distribution: 'temurin'
        java-version: 21
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      with:
        cache-provider: basic
        cache-read-only: true
    - name: configure gradle properties
      run: |
        mkdir -p ${GRADLE_USER_HOME:-$HOME/.gradle}
        echo 'systemProp.user.name=spring-builds+github' >> ${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties
    - name: deploy
      env:
        DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        ORG_GRADLE_PROJECT_artifactory_publish_username: ${{secrets.ARTIFACTORY_SNAPSHOT_USERNAME}}
        ORG_GRADLE_PROJECT_artifactory_publish_password: ${{secrets.ARTIFACTORY_PASSWORD}}
      run: |
          ./gradlew artifactoryPublish -Partifactory_publish_contextUrl=https://repo.spring.io -Partifactory_publish_repoKey=libs-snapshot-local

# For Gradle configuration of signing, see https://docs.gradle.org/current/userguide/signing_plugin.html#sec:in-memory-keys
# publishMavenJavaPublicationToSonatypeRepository only sends to a staging repository
